name: Build & Release

# Trigger on push to master branch or with a tag
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

# If previous workflow is still running, we push again, we will cancel the previous workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

# Required for softprops/action-gh-release to attach artifacts to a Release
permissions:
  contents: write

jobs:
  Build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Windows
            os: windows-latest
            artifact_name: release-Windows
            artifact_path: |
              build/windows/outputs/*.zip
              build/windows/outputs/*.exe
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      date: ${{ steps.get_version.outputs.date}}
    runs-on: ${{ matrix.os }}
    env:
      # 3.27.3 ships Dart 3.6.1, but pubspec.lock needs Dart >=3.11.0 / Flutter
      # >=3.41.0, so `flutter pub get` could never succeed.
      # 3.41.5 is the newest stable predating flutter/flutter#181345 (2026-03-24),
      # which marks IconData `final` -- the vendored
      # third-party/widget/lucide_icons extends it, so newer SDKs fail to compile.
      FLUTTER_VERSION: 3.41.5
    steps:
      # Checkout branch
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # Flutter Pub Get
      - name: Flutter Pub Get
        run: |
          git config --global core.longpaths true
          flutter doctor -v
          flutter pub get
          dart run intl_utils:generate

      # awesome_chewie ships its .arb files but its generated Dart output lands in
      # lib/src/generated/, which .gitignore excludes. Flutter's incremental build
      # normally generates it, but a stale build/ stamp committed into the repo
      # makes it skip. Generate it explicitly so the build never depends on that.
      - name: Generate awesome_chewie localizations
        working-directory: third-party/chewie
        run: |
          flutter pub get
          flutter gen-l10n

      # Get app version
      - name: Get app version
        id: get_version
        shell: bash
        run: |
          echo "version=$(head -n 2 pubspec.yaml | tail -n 1 | cut -d ' ' -f 2 | cut -d '+' -f 1)" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      # Build Windows .zip
      - name: Build Windows
        run: |
          flutter build windows --release
          $DestDir = "build\windows\outputs\Loftify-${{ steps.get_version.outputs.version }}-windows-x86_64"
          $SrcDir = "build\windows\x64\runner\Release"
          $dllDir = "tools\windows_dll"

          Copy-Item -Filter *.dll -Path $dllDir\* -Destination $SrcDir -Force

          # Fail loudly instead of shipping a package that renders a blank window.
          # See: tools/windows_dll/sqlite3.dll must be present for sqflite_common_ffi.
          if (-not (Test-Path "$SrcDir\sqlite3.dll")) {
            Write-Error "sqlite3.dll is missing from $SrcDir - the packaged app would start but never render. Check tools/windows_dll/."
            exit 1
          }

          New-Item -Path $DestDir -ItemType Directory
          Copy-Item $SrcDir\* -Recurse $DestDir

          Compress-Archive $DestDir build\windows\outputs\Loftify-${{ steps.get_version.outputs.version }}-windows-x86_64.zip

          (Get-Content tools/windows_tools/Loftify.iss) -replace '#define MyAppVersion ".*"', '#define MyAppVersion "${{ steps.get_version.outputs.version }}"' | Set-Content tools/windows_tools/Loftify.iss

      # Build Windows .exe (installer). Non-blocking: the portable .zip is the primary artifact.
      - name: Build Windows Installer
        continue-on-error: true
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.6
        with:
          path: tools/windows_tools/Loftify.iss

      # Upload Artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: ignore

  Publish:
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get app version
        id: get_version
        shell: bash
        run: |
          echo "version=$(head -n 2 pubspec.yaml | tail -n 1 | cut -d ' ' -f 2 | cut -d '+' -f 1)" >> $GITHUB_OUTPUT

      - name: Make tmp dir
        run: mkdir /tmp/artifacts

      - name: Download all Artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - name: List and move all Artifacts
        run: |
          mkdir -p /tmp/artifacts/final
          # Only the Windows leg exists in this fork.
          cp -r /tmp/artifacts/release-Windows/. /tmp/artifacts/final/
          cd /tmp/artifacts/final
          for file in *; do
            if [ -f "$file" ]; then
              sha1sum "$file" | awk '{ print $1 }' > "$file.sha1"
            fi
          done
          ls -R /tmp/artifacts/final

      # Was Robert-Stackflow/release-action + an S3 upload that needs secrets this fork does not have.
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/artifacts/final/*
          generate_release_notes: true
          draft: true
